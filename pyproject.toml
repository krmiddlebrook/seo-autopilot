[project]
name = "seo-autopilot"
version = "0.1.0"
description = "Local, near-free SEO autopilot: plan, research, write, score, illustrate and publish one post a day."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "trafilatura>=1.12",
    "lxml>=5.0",
    "markdown>=3.6",
]

[project.optional-dependencies]
gsc = ["google-auth>=2.30", "google-auth-oauthlib>=1.2", "requests>=2.31"]
embeddings = ["sentence-transformers>=3.0"]

[project.scripts]
autopilot = "autopilot.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autopilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
